<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Speech naturalness listening test</title>
<style>
:root{--bg:#ffffff;--ink:#1d1d1f;--muted:#5f6368;--rule:#d9d9d9;--link:#1a56b0;--accent:#A2525E;--danger:#a3262f;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141414;--ink:#ebe9e6;--muted:#a0a4a8;--rule:#3b3b3b;--link:#82b1f2;--accent:#d98895;--danger:#f08a92;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141414;--ink:#ebe9e6;--muted:#a0a4a8;--rule:#3b3b3b;--link:#82b1f2;--accent:#d98895;--danger:#f08a92;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Georgia,"Times New Roman",serif}
.page{max-width:680px;margin:0 auto;padding-inline:20px;padding-block:36px 72px}
h1{font-size:28px;font-weight:600;line-height:1.25;margin:0 0 6px;text-wrap:balance}
h2{font-size:20px;font-weight:600;margin:30px 0 8px;text-wrap:balance}
p{margin:0 0 12px}
.sub{color:var(--muted);margin:0 0 24px}
.note{color:var(--muted);font-size:15px}
a{color:var(--link);text-decoration:none}a:hover{text-decoration:underline}
a:focus-visible,button:focus-visible,input:focus-visible+label,audio:focus-visible,textarea:focus-visible{outline:2px solid var(--link);outline-offset:3px}
ul.plain{margin:0 0 14px;padding-left:1.2em}ul.plain li{margin-bottom:6px}
fieldset{border:0;margin:0 0 22px;padding:0;min-width:0}
legend{font-weight:600;padding:0;margin-bottom:6px}
.opts{display:flex;flex-wrap:wrap;gap:4px 22px}
.opts input{position:absolute;opacity:0;width:1px;height:1px}
.opts label{display:inline-block;min-height:44px;padding-block:8px;border-bottom:2px solid transparent;cursor:pointer}
.opts input:checked+label{border-bottom-color:var(--accent);color:var(--accent);font-weight:600}
.check{display:flex;gap:10px;align-items:flex-start;margin:18px 0}
.check input{margin-top:7px;width:18px;height:18px;accent-color:var(--accent);flex:none}
.btn{font:inherit;color:var(--accent);background:none;border:0;border-bottom:2px solid var(--accent);padding:10px 2px;min-height:44px;cursor:pointer;font-weight:600}
.btn[disabled]{color:var(--muted);border-bottom-color:var(--rule);cursor:not-allowed}
.btn.plain{color:var(--link);border-bottom-color:transparent;font-weight:400}
.row{display:flex;flex-wrap:wrap;gap:12px 26px;align-items:center;margin-top:18px}
.lang{display:flex;justify-content:flex-end;gap:14px;font-size:15px;margin-bottom:10px}
.lang button{font:inherit;background:none;border:0;color:var(--link);cursor:pointer;padding:8px 2px;min-height:36px}
.lang button[aria-pressed="true"]{color:var(--ink);font-weight:600;cursor:default}
.top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;color:var(--muted);font-size:15px;border-bottom:1px solid var(--rule);padding-bottom:8px;margin-bottom:26px}
.top span:first-child{white-space:nowrap}
progress{width:100%;height:4px;appearance:none;-webkit-appearance:none;border:0;background:var(--rule);display:block;margin:0 0 6px}
progress::-webkit-progress-bar{background:var(--rule)}progress::-webkit-progress-value{background:var(--accent)}progress::-moz-progress-bar{background:var(--accent)}
audio{width:100%;height:44px;margin:4px 0 8px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:0 6px;margin:6px 0 4px;padding:0;border:0}
.scale input{position:absolute;opacity:0;width:1px;height:1px}
.scale label{display:flex;flex-direction:column;align-items:center;text-align:center;min-height:76px;padding:8px 2px;border-bottom:2px solid var(--rule);cursor:pointer;font-size:14px;color:var(--muted);line-height:1.25}
.scale label b{font-size:26px;font-weight:600;color:var(--ink);line-height:1.2}
.scale input:checked+label{border-bottom-color:var(--accent);color:var(--accent)}
.scale input:checked+label b{color:var(--accent)}
.scale input:disabled+label{opacity:.45;cursor:not-allowed}
.scale input:focus-visible+label{outline:2px solid var(--link);outline-offset:2px}
.hint{min-height:1.6em;color:var(--muted);font-size:15px}
.err{color:var(--danger)}
textarea{width:100%;min-height:7em;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;color:var(--ink);background:var(--bg);border:1px solid var(--rule);padding:8px;resize:vertical}
.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.hp{position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden}
footer{margin-top:44px;color:var(--muted);font-size:14px;border-top:1px solid var(--rule);padding-top:10px}
</style>
</head>

    clear();
    var go = el('button', { class: 'btn', onclick: function () { S.stage = 'practice'; S.startedAt = S.startedAt || new Date().toISOString(); save(); render(); } }, [T('start')]);
    function upd() { if (S.setup.headphones && S.setup.native && S.setup.environment) go.removeAttribute('disabled'); else go.setAttribute('disabled', ''); }
    upd();
    function pick(k) { return function (v) { S.setup[k] = v; save(); upd(); }; }
    APP.append(
      el('h1', { text: T('before') }),
      el('p', { class: 'sub', text: T('beforeSub') }),
      radioGroup('hp', T('q1'), [['yes', T('yes')], ['no', T('no')]], S.setup.headphones, pick('headphones')),
      radioGroup('ne', T('q2'), [['yes', T('yes')], ['no', T('no')], ['prefer_not', T('pns')]], S.setup.native, pick('native')),
      radioGroup('env', T('q3'), [['quiet', T('quiet')], ['noisy', T('noisy')]], S.setup.environment, pick('environment')),
      el('div', { class: 'row' }, [go])
    );
  }

  // one rating screen for both practice (isPrac) and real clips
  function screenRate(isPrac) {
    clear();
    var n = S.order.length, id = isPrac ? S.prac[S.pidx] : S.order[S.idx];
    var store = isPrac ? S.pans : S.ans;
    var pos = isPrac ? S.pidx + 1 : S.idx + 1;
    var a = store[id] || (store[id] = { r: null, plays: 0, ended: 0, ms: 0, changes: 0, pos: pos });
    var audio = el('audio', { controls: '', preload: 'auto', 'aria-label': isPrac ? T('practiceTag', { i: pos }) : T('clipOf', { i: pos, n: n }) });
    audio.src = 'mp3/' + id + '.mp3';
    var hint = el('p', { class: 'hint', id: 'hint' });
    var reload = el('button', { class: 'btn plain', style: 'display:none', onclick: function () { audio.load(); reload.style.display = 'none'; } }, [T('retry')]);
    var last = isPrac ? S.pidx === 1 : S.idx === n - 1;
    var next = el('button', { class: 'btn', id: 'next' }, [isPrac ? T('next') : (last ? T('finish') : T('next'))]);
    var radios = [];
    var fs = el('fieldset', { class: 'scale', 'aria-describedby': 'hint' }, [el('legend', { class: 'sr', text: T('question') })]);
    for (var v = 1; v <= 5; v++) {
      (function (v) {
        var inp = el('input', { type: 'radio', name: 'rate', id: 'r' + v, value: String(v) });
        if (a.r === v) inp.checked = true;
        inp.addEventListener('change', function () { if (a.r !== v) { if (a.r !== null) a.changes++; a.r = v; } save(); sync(); });
        radios.push(inp);
        fs.append(el('span', {}, [inp, el('label', { for: 'r' + v }, [el('b', { text: String(v) }), T('l' + v), el('span', { class: 'sr', text: ': ' + T('d' + v) })])]));
      })(v);
    }
    function sync() {
      var heard = a.ended > 0;
      radios.forEach(function (r) { r.disabled = !heard; });
      if (!heard) { hint.textContent = T('play'); hint.className = 'hint'; }
      else if (a.r === null) { hint.textContent = T('pick'); hint.className = 'hint'; }
      else { hint.textContent = ''; }
      if (heard && a.r !== null) next.removeAttribute('disabled'); else next.setAttribute('disabled', '');
    }
    audio.addEventListener('play', function () { if (audio.currentTime < 0.3) { a.plays++; save(); } });
    audio.addEventListener('ended', function () { a.ended++; save(); sync(); });
    audio.addEventListener('error', function () { hint.textContent = T('audioErr'); hint.className = 'hint err'; reload.style.display = ''; });
    next.addEventListener('click', function () {
      finishClip();
      if (isPrac) { if (S.pidx < 1) S.pidx++; else S.stage = 'pracdone'; save(); render(S.stage === 'practice'); return; }
      if (S.idx < n - 1) { S.idx++; save(); render(true); } else { S.stage = 'submit'; save(); render(); }
    });
    cur = { a: a, t0: performance.now() };
    var left = isPrac ? T('practiceTag', { i: pos }) : T('clipOf', { i: pos, n: n });
    APP.append(
      el('div', { class: 'top' }, [el('span', { text: left }), el('span', { text: T('question') })]),
      el('progress', { max: String(n), value: String(isPrac ? 0 : S.idx), 'aria-label': 'Progress' }),
      isPrac ? el('p', { class: 'note', text: T('practiceNote') }) : document.createDocumentFragment(),
      audio, reload, fs, hint,
      el('div', { class: 'row' }, [next])
    );
    sync();
    return audio;
  }
  function finishClip() { if (cur) { if (cur.t0 !== null) cur.a.ms += Math.round(performance.now() - cur.t0); cur = null; } }
  document.addEventListener('visibilitychange', function () {
    if (!cur) return;
    if (document.hidden) { if (cur.t0 !== null) cur.a.ms += Math.round(performance.now() - cur.t0); cur.t0 = null; save(); }
    else if (cur.t0 === null) cur.t0 = performance.now();
  });
  document.addEventListener('keydown', function (e) {
    if (!S || (S.stage !== 'rate' && S.stage !== 'practice') || e.ctrlKey || e.metaKey || e.altKey) return;
    if (/^[1-5]$/.test(e.key)) { var r = document.getElementById('r' + e.key); if (r && !r.disabled) { r.checked = true; r.dispatchEvent(new Event('change')); } }
  });

  function screenPracDone() {
    clear();
    APP.append(el('h1', { text: T('practiceDone') }), el('p', { class: 'sub', text: T('practiceDoneSub') }),
      el('p', { text: T('practiceDoneP', { n: N }) }),
      el('div', { class: 'row' }, [el('button', { class: 'btn', onclick: function () { S.stage = 'rate'; save(); render(true); } }, [T('begin')])]));
  }

  /* ---------- payload ---------- */
  function build() {
    var ratings = {}, attention = {}, clips = {}, practice = {}, tot = 0, plays = 0;
    S.prac.forEach(function (id) { if (S.pans[id]) practice[id] = S.pans[id].r; });
    S.order.forEach(function (id) {
      var a = S.ans[id]; tot += a.ms; plays += a.plays;
      (ATT.indexOf(id) >= 0 ? attention : ratings)[id] = a.r;
      clips[id] = [a.pos, a.plays, a.ms, a.changes];
    });
    return {
      participant_id: S.pid, test_version: VERSION, seed: S.seed, ratings: ratings, attention: attention,
      meta: { headphones: S.setup.headphones, native_english: S.setup.native, quiet: S.setup.environment, user_agent_class: devClass(),
              duration_s: Math.max(1, Math.round(tot / 1000)), plays: plays, lang: lang, started_at: S.startedAt, clips: clips, order: S.order, practice: practice }
    };
  }

  function post(body, tries) {
    return fetch(SB_URL, { method: 'POST', headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json', Prefer: 'return=minimal' }, body: JSON.stringify(body), keepalive: false })
      .then(function (r) {
        if (r.status === 201 || r.status === 409) return 'ok';           // 409: this participant id is already stored (an earlier try arrived)
        if (r.status >= 500 || r.status === 429) throw { retry: true, code: r.status };
        throw { retry: false, code: r.status };
      }, function () { throw { retry: true, code: 'network' }; })
      .catch(function (e) {
        if (e && e.retry && tries > 1) return new Promise(function (res) { setTimeout(res, 900 * (4 - tries) + Math.random() * 500); }).then(function () { return post(body, tries - 1); });
        throw e;
      });
  }

  function screenSubmit() {
    clear();
    var status = el('p', { class: 'hint', id: 'status' });
    var hp = el('input', { type: 'text', name: 'website', id: 'website', tabindex: '-1', autocomplete: 'off', 'aria-hidden': 'true' });
    var btn = el('button', { class: 'btn', onclick: submit }, [T('submit')]);
    var fb = el('div', { id: 'fallback' });
    function submit() {
      btn.setAttribute('disabled', ''); status.className = 'hint'; status.textContent = T('sending');
      var body = build();
      var p = hp.value ? Promise.resolve('ok') : post(body, 4);    // honeypot filled: a bot; pretend success, store nothing
      p.then(function () {
        S.submitted = true; lsSet(LS_DONE, { pid: S.pid, at: new Date().toISOString() }); lsDel(LS_KEY); S.stage = 'done'; render();
      }, function (err) {
        status.className = 'hint err';
        status.textContent = (err && err.retry === false) ? T('failRej', { c: err.code }) : T('failNet');
        btn.removeAttribute('disabled');
        fb.textContent = '';
        var ta = el('textarea', { id: 'code', readonly: '', 'aria-label': T('codeLabel') });
        try { ta.value = btoa(unescape(encodeURIComponent(JSON.stringify(body)))); } catch (e) { ta.value = JSON.stringify(body); }
        var cp = el('button', { class: 'btn plain', onclick: function () {
          var ok = function () { cp.textContent = T('copied'); }, no = function () { ta.focus(); ta.select(); cp.textContent = T('manual'); };
          try { navigator.clipboard.writeText(ta.value).then(ok, no); } catch (e) { no(); }
        } }, [T('copy')]);
        fb.append(ta, el('div', { class: 'row' }, [cp]));
      });
    }
    APP.append(
      el('h1', { text: T('doneAll') }),
      el('p', { class: 'sub', text: T('notSent') }),
      el('p', { text: T('submitP', { n: ATT.length + TEST.length, pid: S.pid }) }),
      el('div', { class: 'hp', 'aria-hidden': 'true' }, [el('label', { for: 'website', text: 'Leave this empty' }), hp]),
      el('div', { class: 'row' }, [btn]), status, fb
    );
  }

  function screenDone(returning) {
    clear();
    var pid = S ? S.pid : (lsGet(LS_DONE) || {}).pid;
    APP.append(
      el('h1', { text: T('thanks') }),
      el('p', { class: 'sub', text: returning ? T('returning') : T('saved') }),
      el('p', { text: T('thanksP') }),
      el('p', { class: 'note', text: T('human') }),
      pid ? el('p', { class: 'note', text: T('codeP', { pid: pid }) }) : document.createDocumentFragment()
    );
  }

  function render(autoplay) {
    document.documentElement.lang = lang;
    document.title = T('title');
    document.getElementById('foot').innerHTML = t('foot');
    document.getElementById('l-en').setAttribute('aria-pressed', String(lang === 'en'));
    document.getElementById('l-es').setAttribute('aria-pressed', String(lang === 'es'));
    if (!S) return screenDone(true);
    var st = S.stage;
    if (st === 'intro') return screenIntro();
    if (st === 'setup') return screenSetup();
    if (st === 'practice' || st === 'rate') {
      var a = screenRate(st === 'practice');
      if (autoplay) { try { var p = a.play(); if (p && p.catch) p.catch(function () {}); } catch (e) {} }
      return;
    }
    if (st === 'pracdone') return screenPracDone();
    if (st === 'submit') return screenSubmit();
    return screenDone(false);
  }

  function setLang(l) { lang = l; lsSet(LS_LANG, l); if (S && (S.stage === 'practice' || S.stage === 'rate')) {  } render(false); }
  document.getElementById('l-en').addEventListener('click', function () { setLang('en'); });
  document.getElementById('l-es').addEventListener('click', function () { setLang('es'); });

  function boot() {
    var sl = lsGet(LS_LANG);
    lang = (sl === 'es' || sl === 'en') ? sl : (/^es/i.test(navigator.language || '') ? 'es' : 'en');
    var done = lsGet(LS_DONE);
    if (done && done.pid) { S = null; render(false); return; }
    var saved = lsGet(LS_KEY);
    var ok = saved && saved.v === VERSION && saved.order && saved.order.length === N && saved.prac && saved.stage !== 'done';
    S = ok ? saved : newSession();
    render(false);
  }
  try { boot(); } catch (e) { APP.textContent = T('loadErr'); }
})();
</script>
</body>
</html>
